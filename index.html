<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Class Battle</title>

  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --card: #1b202b;
      --text: #f5f7fb;
      --muted: #9ca5b5;
      --line: #2a3140;
      --accent: #7c5cff;
      --good: #35d07f;
      --danger: #ff5d6c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1180px;
      margin: auto;
      padding: 24px;
    }

    /* HEADER */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    /* BUTTONS */

    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 11px 15px;
      border-radius: 11px;
      font-weight: 700;
    }

    .btn:hover {
      border-color: #555f73;
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .danger {
      color: #ff8792;
    }

    /* TEAMS */

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .team {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      transition: 0.2s;
    }

    .team.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px #7c5cff33;
    }

    .team-name {
      font-weight: 800;
      font-size: 15px;
    }

    .money {
      font-size: 30px;
      font-weight: 900;
      margin: 12px 0;
    }

    .team-controls {
      display: flex;
      gap: 7px;
    }

    .small {
      padding: 8px 10px;
      border-radius: 9px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 800;
    }

    /* MAIN */

    .main {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
    }

    /* GAME */

    .selected {
      text-align: center;
      padding: 22px 10px;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      font-weight: 800;
    }

    .selected h2 {
      font-size: 36px;
      margin: 8px 0 20px;
    }

    .challenge-title {
      font-size: 15px;
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .challenge-text {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      margin: 14px auto;
      max-width: 760px;
    }

    /* TIMER */

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 78px;
      font-weight: 900;
      letter-spacing: -3px;
      margin: 16px 0;
    }

    .timer.done {
      color: var(--danger);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .actions .btn {
      min-width: 130px;
    }

    /* MONEY */

    .money-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .money-actions button {
      flex: 1;
      min-width: 90px;
    }

    /* SIDE PANEL */

    .side h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .form {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0f1219;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* CHALLENGES */

    .challenge-list {
      display: grid;
      gap: 8px;
      max-height: 330px;
      overflow-y: auto;
    }

    .challenge-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--card);
      padding: 11px;
      border-radius: 10px;
    }

    .challenge-item strong {
      display: block;
    }

    .challenge-item small {
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
    }

    /* FINAL SCREEN */

    .overlay {
      position: fixed;
      inset: 0;
      background: #05060acc;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: min(620px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px;
      text-align: center;
    }

    .modal h1 {
      font-size: 48px;
      margin: 8px 0 20px;
    }

    .final {
      display: grid;
      gap: 10px;
      margin: 20px 0;
    }

    .final div {
      display: flex;
      justify-content: space-between;
      background: var(--card);
      padding: 14px;
      border-radius: 11px;
      font-weight: 800;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .scoreboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .main {
        grid-template-columns: 1fr;
      }

      .challenge-text {
        font-size: 25px;
      }

      .timer {
        font-size: 62px;
      }
    }

    @media (max-width: 500px) {

      .app {
        padding: 14px;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .money {
        font-size: 24px;
      }

      .timer {
        font-size: 55px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="top">

    <div class="brand">
      CLASS <span>BATTLE</span>
    </div>

    <div class="top-actions">
      <button class="btn" id="resetBtn">
        Reset
      </button>

      <button class="btn primary" id="finishBtn">
        Finish Game
      </button>
    </div>

  </header>


  <!-- SCOREBOARD -->

  <section class="scoreboard" id="scoreboard"></section>


  <!-- MAIN -->

  <main class="main">


    <!-- GAME AREA -->

    <section class="panel">

      <div class="selected">

        <div class="label">
          Current Team
        </div>

        <h2 id="currentTeam">
          No team selected
        </h2>


        <div class="challenge-title" id="challengeTitle">
          Choose a challenge
        </div>


        <div class="challenge-text" id="challengeText">
          Add your own challenge, then pick a team.
        </div>


        <div class="timer" id="timer">
          30
        </div>


        <div class="actions">

          <button class="btn primary" id="pickBtn">
            🎲 Pick Random Team
          </button>

          <button class="btn" id="timerBtn">
            ⏱ Start Timer
          </button>

          <button class="btn" id="nextBtn">
            Next Challenge
          </button>

        </div>


        <!-- MONEY BUTTONS -->

        <div class="money-actions">

          <button class="btn" data-money="500">
            +500
          </button>

          <button class="btn" data-money="1000">
            +1,000
          </button>

          <button class="btn" data-money="2000">
            +2,000
          </button>

          <button class="btn danger" data-money="-500">
            −500
          </button>

        </div>

      </div>

    </section>


    <!-- SETUP PANEL -->

    <aside class="panel side">

      <h3>
        Game Setup
      </h3>


      <!-- TEAM NAMES -->

      <div class="form">

        <div class="row">

          <input
            id="teamA"
            value="Team A"
            placeholder="Team A"
          >

          <input
            id="teamB"
            value="Team B"
            placeholder="Team B"
          >

        </div>


        <div class="row">

          <input
            id="teamC"
            value="Team C"
            placeholder="Team C"
          >

          <input
            id="teamD"
            value="Team D"
            placeholder="Team D"
          >

        </div>


        <button class="btn" id="updateTeams">
          Update Team Names
        </button>

      </div>


      <!-- ADD CHALLENGE -->

      <h3>
        Add Challenge
      </h3>

      <div class="form">

        <input
          id="newTitle"
          placeholder="Challenge name"
        >


        <textarea
          id="newText"
          placeholder="Write the challenge here..."
        ></textarea>


        <div class="row">

          <select id="newTime">

            <option value="30">
              30 sec
            </option>

            <option value="45">
              45 sec
            </option>

            <option value="60">
              60 sec
            </option>

            <option value="90">
              90 sec
            </option>

            <option value="120">
              2 min
            </option>

          </select>


          <button class="btn primary" id="addChallenge">
            Add Challenge
          </button>

        </div>

      </div>


      <!-- CHALLENGE LIST -->

      <h3>
        Your Challenges
      </h3>

      <div
        class="challenge-list"
        id="challengeList"
      ></div>

    </aside>

  </main>

</div>


<!-- FINAL SCORE POPUP -->

<div
  class="overlay"
  id="finishOverlay"
>

  <div class="modal">

    <div class="label">
      Game Complete
    </div>

    <h1>
      CLASS BATTLE
    </h1>

    <div
      class="final"
      id="finalScores"
    ></div>

    <button
      class="btn primary"
      id="closeFinish"
    >
      Close
    </button>

  </div>

</div>


<script>

(() => {

  /* =========================
     GAME DATA
  ========================= */

  const state = {

    teams: [

      {
        name: "Team A",
        money: 5000
      },

      {
        name: "Team B",
        money: 5000
      },

      {
        name: "Team C",
        money: 5000
      },

      {
        name: "Team D",
        money: 5000
      }

    ],


    challenges: [

      {
        title: "SPEAK FAST",
        text: "TRAVEL",
        time: 30
      },

      {
        title: "DON'T SAY IT",
        text: "Describe HOSPITAL without saying the word.",
        time: 45
      },

      {
        title: "SITUATION",
        text: "You lost your phone. Ask your friend for help.",
        time: 60
      },

      {
        title: "STORY BUILDER",
        text: "Create a story using DOG, RAIN and BUS.",
        time: 60
      }

    ],


    currentTeam: -1,

    currentChallenge: -1,

    time: 30,

    interval: null

  };


  /* =========================
     HELPERS
  ========================= */

  function $(id) {
    return document.getElementById(id);
  }


  function escapeHtml(text) {

    return String(text).replace(
      /[&<>"']/g,

      function(match) {

        const chars = {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        };

        return chars[match];

      }
    );

  }


  function formatTime(seconds) {

    const minutes =
      Math.floor(seconds / 60);

    const secs =
      seconds % 60;


    if (minutes > 0) {

      return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
      );

    }


    return String(secs);

  }


  /* =========================
     RENDER TEAMS
  ========================= */

  function renderTeams() {

    const scoreboard =
      $("scoreboard");

    scoreboard.innerHTML = "";


    state.teams.forEach(
      (team, index) => {

        const element =
          document.createElement("div");


        element.className =
          "team" +
          (
            index === state.currentTeam
              ? " active"
              : ""
          );


        element.innerHTML = `

          <div class="team-name">
            ${escapeHtml(team.name)}
          </div>

          <div class="money">
            ${team.money.toLocaleString()}
          </div>

          <div class="team-controls">

            <button
              class="small"
              data-team="${index}"
              data-change="500"
            >
              +500
            </button>

            <button
              class="small"
              data-team="${index}"
              data-change="-500"
            >
              −500
            </button>

          </div>

        `;


        scoreboard.appendChild(element);

      }
    );

  }


  /* =========================
     RENDER CHALLENGES
  ========================= */

  function renderChallenges() {

    const list =
      $("challengeList");

    list.innerHTML = "";


    if (
      state.challenges.length === 0
    ) {

      list.innerHTML =
        '<div class="empty">No challenges yet.</div>';

      return;

    }


    state.challenges.forEach(
      (challenge, index) => {

        const element =
          document.createElement("div");


        element.className =
          "challenge-item";


        element.innerHTML = `

          <div>

            <strong>
              ${escapeHtml(challenge.title)}
            </strong>

            <small>
              ${escapeHtml(challenge.text)}
              ·
              ${challenge.time}s
            </small>

          </div>


          <button
            class="small danger"
            data-delete="${index}"
          >
            Delete
          </button>

        `;


        list.appendChild(element);

      }
    );

  }


  /* =========================
     SHOW CHALLENGE
  ========================= */

  function showChallenge(index) {

    if (
      state.challenges.length === 0
    ) {

      return;

    }


    state.currentChallenge =
      (
        index +
        state.challenges.length
      ) %
      state.challenges.length;


    const challenge =
      state.challenges[
        state.currentChallenge
      ];


    stopTimer();


    state.time =
      challenge.time;


    $("challengeTitle").textContent =
      challenge.title;


    $("challengeText").textContent =
      challenge.text;


    $("timer").textContent =
      formatTime(state.time);


    $("timer").classList.remove(
      "done"
    );

  }


  /* =========================
     RANDOM TEAM
  ========================= */

  function pickTeam() {

    if (
      state.teams.length === 0
    ) {

      return;

    }


    let random =
      Math.floor(
        Math.random() *
        state.teams.length
      );


    if (
      state.teams.length > 1 &&
      random === state.currentTeam
    ) {

      random =
        (
          random +
          1 +
          Math.floor(
            Math.random() *
            (state.teams.length - 1)
          )
        ) %
        state.teams.length;

    }


    state.currentTeam =
      random;


    $("currentTeam").textContent =
      state.teams[random].name;


    renderTeams();

  }


  /* =========================
     TIMER
  ========================= */

  function stopTimer() {

    if (state.interval) {

      clearInterval(
        state.interval
      );

      state.interval = null;

    }


    $("timerBtn").textContent =
      "⏱ Start Timer";

  }


  function startTimer() {

    if (state.interval) {

      return;

    }


    state.interval =
      setInterval(
        () => {

          state.time--;


          $("timer").textContent =
            formatTime(
              Math.max(
                0,
                state.time
              )
            );


          if (
            state.time <= 0
          ) {

            stopTimer();


            $("timer").classList.add(
              "done"
            );


            $("timer").textContent =
              "TIME'S UP!";

          }

        },

        1000
      );


    $("timerBtn").textContent =
      "⏸ Pause Timer";

  }


  /* =========================
     MONEY
  ========================= */

  function changeMoney(amount) {

    if (
      state.currentTeam < 0
    ) {

      alert(
        "Pick a team first."
      );

      return;

    }


    state.teams[
      state.currentTeam
    ].money =
      Math.max(
        0,
        state.teams[
          state.currentTeam
        ].money + amount
      );


    renderTeams();

  }


  /* =========================
     BUTTON EVENTS
  ========================= */

  $("pickBtn")
    .addEventListener(
      "click",
      pickTeam
    );


  $("timerBtn")
    .addEventListener(
      "click",

      () => {

        if (state.interval) {

          stopTimer();

        } else {

          startTimer();

        }

      }
    );


  $("nextBtn")
    .addEventListener(
      "click",

      () => {

        if (
          state.currentChallenge < 0
        ) {

          showChallenge(0);

        } else {

          showChallenge(
            state.currentChallenge + 1
          );

        }

      }
    );


  /* MONEY BUTTONS */

  document
    .querySelectorAll(
      "[data-money]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",

          () => {

            changeMoney(
              Number(
                button.dataset.money
              )
            );

          }
        );

      }
    );


  /* TEAM SMALL BUTTONS */

  $("scoreboard")
    .addEventListener(
      "click",

      event => {

        const button =
          event.target.closest(
            "[data-team]"
          );


        if (!button) {

          return;

        }


        const team =
          Number(
            button.dataset.team
          );


        const amount =
          Number(
            button.dataset.change
          );


        state.teams[team].money =
          Math.max(
            0,
            state.teams[team].money +
            amount
          );


        renderTeams();

      }
    );


  /* =========================
     ADD CHALLENGE
  ========================= */

  $("addChallenge")
    .addEventListener(
      "click",

      () => {

        const title =
          $("newTitle")
            .value
            .trim();


        const text =
          $("newText")
            .value
            .trim();


        const time =
          Number(
            $("newTime").value
          );


        if (
          !title ||
          !text
        ) {

          alert(
            "Add a challenge name and challenge text."
          );

          return;

        }


        state.challenges.push({

          title: title,

          text: text,

          time: time

        });


        $("newTitle").value = "";

        $("newText").value = "";


        renderChallenges();


        if (
          state.currentChallenge < 0
        ) {

          showChallenge(0);

        }

      }
    );


  /* =========================
     DELETE CHALLENGE
  ========================= */

  $("challengeList")
    .addEventListener(
      "click",

      event => {

        const button =
          event.target.closest(
            "[data-delete]"
          );


        if (!button) {

          return;

        }


        const index =
          Number(
            button.dataset.delete
          );


        state.challenges.splice(
          index,
          1
        );


        if (
          state.currentChallenge >=
          state.challenges.length
        ) {

          state.currentChallenge =
            state.challenges.length - 1;

        }


        renderChallenges();


        if (
          state.currentChallenge >= 0
        ) {

          showChallenge(
            state.currentChallenge
          );

        }

      }
    );


  /* =========================
     UPDATE TEAM NAMES
  ========================= */

  $("updateTeams")
    .addEventListener(
      "click",

      () => {

        const ids = [
          "teamA",
          "teamB",
          "teamC",
          "teamD"
        ];


        ids.forEach(
          (id, index) => {

            const value =
              $(id)
                .value
                .trim();


            if (value) {

              state.teams[index].name =
                value;

            }

          }
        );


        if (
          state.currentTeam >= 0
        ) {

          $("currentTeam")
            .textContent =
            state.teams[
              state.currentTeam
            ].name;

        }


        renderTeams();

      }
    );


  /* =========================
     FINISH GAME
  ========================= */

  $("finishBtn")
    .addEventListener(
      "click",

      () => {

        stopTimer();


        const scores =
          state.teams
            .slice()
            .sort(
              (a, b) =>
                b.money - a.money
            );


        $("finalScores").innerHTML =
          scores
            .map(
              (team, index) => `

                <div>

                  <span>
                    ${index + 1}.
                    ${escapeHtml(team.name)}
                  </span>

                  <span>
                    ${team.money.toLocaleString()}
                  </span>

                </div>

              `
            )
            .join("");


        $("finishOverlay")
          .classList
          .add("show");

      }
    );


  $("closeFinish")
    .addEventListener(
      "click",

      () => {

        $("finishOverlay")
          .classList
          .remove("show");

      }
    );


  /* =========================
     RESET
  ========================= */

  $("resetBtn")
    .addEventListener(
      "click",

      () => {

        const answer =
          confirm(
            "Reset the game and all scores?"
          );


        if (!answer) {

          return;

        }


        stopTimer();


        state.teams.forEach(
          team => {

            team.money = 5000;

          }
        );


        state.currentTeam = -1;


        state.currentChallenge = -1;


        $("currentTeam")
          .textContent =
          "No team selected";


        $("challengeTitle")
          .textContent =
          "Choose a challenge";


        $("challengeText")
          .textContent =
          "Add your own challenge, then pick a team.";


        state.time = 30;


        $("timer")
          .textContent = "30";


        $("timer")
          .classList
          .remove("done");


        renderTeams();

      }
    );


  /* =========================
     START
  ========================= */

  renderTeams();

  renderChallenges();

  showChallenge(0);

})();

</script>

</body>
</html>
