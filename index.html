<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monther's Class Battle</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      min-height: 100vh;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 30px;
    }

    .active {
      display: block;
    }

    /* HOME */
    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .home h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .home p {
      color: #666;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .role-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .role-btn {
      width: 220px;
      height: 120px;
      font-size: 22px;
    }

    /* TEACHER */
    .teacher-header,
    .student-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .teacher-header h1,
    .student-header h1 {
      font-size: 30px;
    }

    .teacher-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    .mission-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mission-option {
      width: 100%;
      text-align: left;
      background: #eef1f5;
      color: #111;
    }

    .mission-option.selected {
      background: #111827;
      color: white;
    }

    .preview {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .preview .mission-number {
      color: #777;
      margin-bottom: 15px;
    }

    .preview .mission-text {
      font-size: 28px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 25px;
    }

    .timer {
      font-size: 55px;
      font-weight: bold;
      margin: 20px;
    }

    .teacher-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .danger {
      background: #dc2626;
    }

    .success {
      background: #16a34a;
    }

    .secondary {
      background: #6b7280;
    }

    /* STUDENT */
    .student-screen {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .student-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .student-mission {
      background: white;
      width: min(900px, 95%);
      min-height: 450px;
      border-radius: 25px;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }

    .student-mission small {
      font-size: 20px;
      color: #777;
      margin-bottom: 25px;
    }

    .student-mission h2 {
      font-size: clamp(35px, 6vw, 65px);
      line-height: 1.15;
      margin-bottom: 35px;
    }

    .student-timer {
      font-size: 75px;
      font-weight: bold;
    }

    .finished {
      color: #dc2626;
    }

    @media (max-width: 750px) {
      .teacher-layout {
        grid-template-columns: 1fr;
      }

      .screen {
        padding: 20px;
      }

      .home h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- HOME SCREEN -->
  <section id="homeScreen" class="screen active home">

    <h1>Monther's Class Battle</h1>

    <p>Choose your role</p>

    <div class="role-buttons">
      <button class="role-btn" onclick="openTeacher()">
        Teacher
      </button>

      <button class="role-btn" onclick="openStudent()">
        Student
      </button>
    </div>

  </section>


  <!-- TEACHER SCREEN -->
  <section id="teacherScreen" class="screen">

    <div class="teacher-header">
      <h1>Teacher Control</h1>

      <button class="secondary" onclick="goHome()">
        Home
      </button>
    </div>

    <div class="teacher-layout">

      <!-- MISSION SELECTION -->
      <div class="card">

        <h2>Choose a Mission</h2>

        <div class="mission-list">

          <button class="mission-option"
            onclick="selectMission(0)">
            Speak Fast
          </button>

          <button class="mission-option"
            onclick="selectMission(1)">
            Describe the Word
          </button>

          <button class="mission-option"
            onclick="selectMission(2)">
            Three-Word Story
          </button>

          <button class="mission-option"
            onclick="selectMission(3)">
            No "Yes" or "No"
          </button>

          <button class="mission-option"
            onclick="selectMission(4)">
            Talk About It
          </button>

          <button class="mission-option"
            onclick="selectMission(5)">
            Change the Story
          </button>

        </div>

      </div>


      <!-- MISSION PREVIEW -->
      <div class="card">

        <h2>Mission Preview</h2>

        <div class="preview">

          <div class="mission-number" id="missionNumber">
            Mission 1
          </div>

          <div class="mission-text" id="missionText">
            Choose a mission
          </div>

          <div class="timer" id="teacherTimer">
            00:00
          </div>

          <div class="teacher-controls">

            <button class="success" onclick="startMission()">
              START
            </button>

            <button class="danger" onclick="stopMission()">
              STOP
            </button>

            <button class="secondary" onclick="resetMission()">
              RESET
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- STUDENT SCREEN -->
  <section id="studentScreen" class="screen student-screen">

    <div class="student-header">

      <h1>Class Battle</h1>

      <button class="secondary" onclick="goHome()">
        Home
      </button>

    </div>

    <div class="student-content">

      <div class="student-mission">

        <small id="studentMissionNumber">
          Waiting for the teacher...
        </small>

        <h2 id="studentMissionText">
          Get ready!
        </h2>

        <div class="student-timer" id="studentTimer">
          00:00
        </div>

      </div>

    </div>

  </section>


  <script>

    const missions = [

      {
        title: "Speak Fast",
        text: "Speak continuously for 2 minutes. Don't stop talking!"
      },

      {
        title: "Describe the Word",
        text: "Describe the word WITHOUT saying the word itself."
      },

      {
        title: "Three-Word Story",
        text: "Create a story using these 3 words: hospital, football, pizza."
      },

      {
        title: "No Yes or No",
        text: "Answer the questions for 1 minute without saying YES or NO."
      },

      {
        title: "Talk About It",
        text: "Talk about your favorite place for 90 seconds."
      },

      {
        title: "Change the Story",
        text: "Create a short story. Your team can change one thing every 20 seconds."
      }

    ];


    let selectedMission = 0;

    let timeLeft = 0;

    let timerInterval = null;


    function showScreen(id) {

      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");

    }


    function openTeacher() {

      showScreen("teacherScreen");

      selectMission(0);

    }


    function openStudent() {

      showScreen("studentScreen");

      updateStudent();

    }


    function goHome() {

      stopMission();

      showScreen("homeScreen");

    }


    function selectMission(index) {

      stopMission();

      selectedMission = index;

      const mission = missions[index];

      document.getElementById("missionNumber").textContent =
        "Mission " + (index + 1);

      document.getElementById("missionText").textContent =
        mission.text;

      document.getElementById("teacherTimer").textContent =
        "00:00";


      document.querySelectorAll(".mission-option")
        .forEach((button, i) => {

          button.classList.toggle(
            "selected",
            i === index
          );

        });


      updateStudent();

    }


    function updateStudent() {

      const mission = missions[selectedMission];

      document.getElementById(
        "studentMissionNumber"
      ).textContent =
        "MISSION " + (selectedMission + 1);


      document.getElementById(
        "studentMissionText"
      ).textContent =
        mission.text;


      document.getElementById(
        "studentTimer"
      ).textContent =
        formatTime(timeLeft);

    }


    function startMission() {

      stopMission();


      const durations = [
        120,
        60,
        120,
        60,
        90,
        120
      ];


      timeLeft = durations[selectedMission];

      updateTimers();


      timerInterval = setInterval(() => {

        timeLeft--;

        updateTimers();


        if (timeLeft <= 0) {

          stopMission();

          document.getElementById(
            "studentTimer"
          ).textContent = "TIME'S UP!";

          document.getElementById(
            "studentTimer"
          ).classList.add("finished");

          document.getElementById(
            "teacherTimer"
          ).textContent = "TIME'S UP!";

        }

      }, 1000);

    }


    function stopMission() {

      if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

      }

    }


    function resetMission() {

      stopMission();

      timeLeft = 0;

      document.getElementById(
        "teacherTimer"
      ).textContent = "00:00";

      document.getElementById(
        "studentTimer"
      ).classList.remove("finished");

      updateStudent();

    }


    function updateTimers() {

      const formatted = formatTime(timeLeft);

      document.getElementById(
        "teacherTimer"
      ).textContent = formatted;


      const studentTimer =
        document.getElementById("studentTimer");

      studentTimer.classList.remove("finished");

      studentTimer.textContent = formatted;

    }


    function formatTime(seconds) {

      const minutes =
        Math.floor(seconds / 60);

      const remainingSeconds =
        seconds % 60;


      return String(minutes).padStart(2, "0")
        + ":"
        + String(remainingSeconds).padStart(2, "0");

    }

  </script>

</body>
</html>
